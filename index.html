<!-- SNAPY KI-CHATBOT WIDGET -->
<div id="snapy-widget" style="position: fixed; bottom: 25px; right: 25px; z-index: 99999; font-family: Inter, sans-serif;">
  <!-- Floating Button -->
  <button id="snapy-trigger" type="button" style="display: flex; align-items: center; gap: 10px; background: #00ff83; color: #052116; border: none; padding: 12px 20px; border-radius: 50px; font-weight: 700; font-size: 13px; cursor: pointer; box-shadow: 0 10px 25px rgba(0,255,131,0.35);">
    <svg style="width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2;" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></svg>
    <span>Frag Snapy (KI)</span>
  </button>

  <!-- Chat Fenster -->
  <div id="snapy-box" style="display: none; position: fixed; bottom: 85px; right: 25px; width: 350px; max-width: calc(100vw - 40px); height: 480px; max-height: calc(100vh - 120px); background: #101617; border: 1px solid rgba(0, 255, 131, 0.3); border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.9); flex-direction: column; overflow: hidden; z-index: 99999;">
    <!-- Chat Kopfzeile -->
    <div style="background: #151d1e; padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="width: 10px; height: 10px; background: #00ff83; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #00ff83;"></span>
        <strong style="color: #f3f5f2; font-size: 14px;">Snapy · KI-Berater</strong>
      </div>
      <button id="snapy-close" type="button" style="background: none; border: none; color: #a5b2b0; font-size: 18px; cursor: pointer; padding: 4px;">✕</button>
    </div>

    <!-- Nachrichten-Verlauf -->
    <div id="snapy-messages" style="flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; font-size: 12px; line-height: 1.5; color: #d5e3da;">
      <div style="background: rgba(0,255,131,0.08); border: 1px solid rgba(0,255,131,0.2); padding: 10px 14px; border-radius: 10px; align-self: flex-start; max-width: 88%;">
        👋 Hi! Ich bin <strong>Snapy</strong>. Frage mich zum <strong>1-Klick-Autopilot</strong>, den <strong>14 Portalen</strong>, dem <strong>Mietvertrag-Generator</strong> oder unseren <strong>Marketing-Kampagnen</strong>!
      </div>
    </div>

    <!-- Schnell-Buttons -->
    <div style="padding: 8px 12px; background: #0c1112; border-top: 1px solid rgba(255,255,255,0.05); display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch;">
      <button type="button" class="snapy-quick" data-msg="Wie funktioniert der 1-Klick Autopilot?" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #a5b2b0; font-size: 10px; padding: 6px 11px; border-radius: 12px; white-space: nowrap; cursor: pointer;">1-Klick Autopilot?</button>
      <button type="button" class="snapy-quick" data-msg="Mietvertrag Generator & Schufa?" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #a5b2b0; font-size: 10px; padding: 6px 11px; border-radius: 12px; white-space: nowrap; cursor: pointer;">Mietverträge & Schufa?</button>
      <button type="button" class="snapy-quick" data-msg="Kann ich Marketing Kampagnen buchen?" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #a5b2b0; font-size: 10px; padding: 6px 11px; border-radius: 12px; white-space: nowrap; cursor: pointer;">Kampagnen & Ads?</button>
    </div>

    <!-- Eingabefeld -->
    <form id="snapy-form" style="display: flex; padding: 10px; border-top: 1px solid rgba(255,255,255,0.1); background: #070a0b; margin: 0;">
      <input type="text" id="snapy-input" placeholder="Schreibe eine Frage..." style="flex: 1; background: #151d1e; border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 8px 12px; border-radius: 8px; font-size: 12px; outline: none;" required>
      <button type="submit" style="background: #00ff83; border: none; color: #052116; padding: 8px 14px; margin-left: 8px; border-radius: 8px; font-weight: 700; cursor: pointer;">➔</button>
    </form>
  </div>
</div>

<script>
(function() {
  function initSnapyWidget() {
    var trigger = document.getElementById('snapy-trigger');
    var box = document.getElementById('snapy-box');
    var close = document.getElementById('snapy-close');
    var form = document.getElementById('snapy-form');
    var input = document.getElementById('snapy-input');
    var messages = document.getElementById('snapy-messages');

    if (!trigger || !box) return;

    trigger.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      var current = window.getComputedStyle(box).display;
      box.style.display = (current === 'none') ? 'flex' : 'none';
    });

    if (close) {
      close.addEventListener('click', function(e) {
        e.preventDefault();
        box.style.display = 'none';
      });
    }

    function addMsg(text, isUser) {
      var msg = document.createElement('div');
      msg.style.padding = '10px 14px';
      msg.style.borderRadius = '10px';
      msg.style.maxWidth = '85%';
      msg.style.alignSelf = isUser ? 'flex-end' : 'flex-start';
      if (isUser) {
        msg.style.background = '#00ff83';
        msg.style.color = '#052116';
        msg.style.fontWeight = '600';
      } else {
        msg.style.background = 'rgba(0,255,131,0.08)';
        msg.style.border = '1px solid rgba(0,255,131,0.2)';
        msg.style.color = '#d5e3da';
      }
      msg.innerHTML = text;
      messages.appendChild(msg);
      messages.scrollTop = messages.scrollHeight;
    }

    function getAiReply(q) {
      var query = (q || '').toLowerCase();

      if (query.includes('autopilot') || query.includes('1-klick') || query.includes('aufpreis') || query.includes('tastendruck')) {
        return '<strong>Snapy 1-Klick-Autopilot:</strong><br>Auf Aufpreis übernimmt Snapy alles mit einem Klick: Inseratstexte, Virtual Staging, Video-Exposé mit Marken-Branding & Hintergrundmusik sowie Verteilung auf 14 Portale!';
      }
      if (query.includes('mietvertrag') || query.includes('schufa') || query.includes('vertrag') || query.includes('generator')) {
        return '<strong>CRM "Der Onkel" & Dokumente:</strong><br>• <strong>Schufa-Check:</strong> Integrierte Bonitätsprüfung direkt im CRM.<br>• <strong>Mietvertrag-Generator:</strong> Rechtssichere Mietverträge & Übergabeprotokolle auf Knopfdruck aus der Kundenakte heraus.';
      }
      if (query.includes('kampagne') || query.includes('ads') || query.includes('werbung') || query.includes('google') || query.includes('landingpage')) {
        return '<strong>Marketing & Landingpages:</strong><br>• <strong>Makler-Landingpages:</strong> Eigene Objekt- & Firmen-Webseiten im individuellen Branding.<br>• <strong>Google & Social Ads:</strong> Gezielte Werbekampagnen für deine Immobilien direkt zubuchbar.';
      }
      if (query.includes('musik') || query.includes('audio') || query.includes('song') || query.includes('stimmung') || query.includes('logo')) {
        return '<strong>Branded KI-Videos:</strong><br>Videos werden mit dezentem Soundtrack, Firmenlogo und deinem Unternehmensnamen hinterlegt – perfekt optimiert für Social Media & Portale.';
      }
      if (query.includes('telefon') || query.includes('anruf') || query.includes('sekretariat')) {
        return '<strong>KI-Telefonassistent:</strong><br>Abgestimmt auf dein Unternehmen und das konkrete Inserat. Nimmt Anrufe 24/7 entgegen, beantwortet Detailfragen und aktualisiert das CRM.';
      }

      return '👋 Ich bin <strong>Snapy</strong>!<br>Frage mich zum <strong>1-Klick Autopilot</strong>, dem <strong>Mietvertrag-Generator</strong>, <strong>Schufa-Checks</strong>, <strong>KI-Branding mit Firmenmusik</strong> oder unseren <strong>Google/Social Ads Kampagnen</strong>!';
    }

    if (form) {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        var val = input.value.trim();
        if (!val) return;
        addMsg(val, true);
        input.value = '';
        setTimeout(function() {
          addMsg(getAiReply(val), false);
        }, 400);
      });
    }

    document.querySelectorAll('.snapy-quick').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        var msg = this.getAttribute('data-msg');
        addMsg(msg, true);
        setTimeout(function() {
          addMsg(getAiReply(msg), false);
        }, 300);
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initSnapyWidget);
  } else {
    initSnapyWidget();
  }
})();
</script>
